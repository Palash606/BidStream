name: 💡 Feature Request
description: Propose a new feature, optimization, or architectural enhancement
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love proposals that elevate BidStream's performance, resilience, and real-time capabilities!
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area of the system does this proposal target?
      options:
        - "Real-Time / WebSockets / Event Streaming"
        - "Distributed Concurrency & Locking"
        - "Microservice Architecture & Gateway"
        - "Security, Auth & Session Management"
        - "UI / UX / Bidder Experience"
        - "CI/CD & Developer Tooling"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution & Architectural Impact
      description: Describe the solution you'd like to see and how it fits into the microservice architecture.
      placeholder: Introduce Kafka event streaming for asynchronous bid receipt auditing...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be interested in submitting a pull request for this feature?
      options:
        - label: I am willing to submit a PR to implement this feature!
