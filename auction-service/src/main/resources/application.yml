server:
  port: 8082

spring:
  application:
    name: auction-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:postgresql://localhost:5432/auction_db
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC # Sync with Identity Service

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

  jackson:
    serialization:
      fail-on-empty-beans: false
      write-dates-as-timestamps: false

  thymeleaf:
    cache: false # Disable for development/debugging
    prefix: classpath:/templates/
    suffix: .html

eureka:
  instance:
    hostname: localhost
    preferIpAddress: true
    ipAddress: 127.0.0.1
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Shared JWT Secret for Microservice Token Validation
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

# Business Logic Settings
auction:
  max-payment-attempts: 3
  lockout-hours: 12
  payment-base-url: "http://localhost:3000/pay/"

# Image Storage
# Local dev: relative path 'uploads/products' lands inside the project working dir
# Production override: set APP_UPLOAD_DIR env var to an absolute path, e.g. /uploads/products
app:
  upload:
    dir: ${APP_UPLOAD_DIR:uploads/products}

logging:
  level:
    com.bidstream.auctionservice.service.SellerVerificationService: DEBUG
    com.bidstream.auctionservice.service.FileSystemStorageService: DEBUG
    com.bidstream.auctionservice.config.JwtAuthenticationFilter: DEBUG
    DLQ: ERROR

# Feign + Resilience4j Circuit Breaker (Feature B)
spring.cloud.openfeign.circuitbreaker.enabled: true

resilience4j:
  circuitbreaker:
    instances:
      identity-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3