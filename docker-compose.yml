services:
  postgres:
    image: postgres:15
    container_name: bidstream-db
    environment:
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./init-sql:/docker-entrypoint-initdb.d # Run scripts on first start
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.local

  redis:
    image: redis:7-alpine
    container_name: bidstream-redis
    command: >
      sh -c "if [ -z \"$$REDIS_PASSWORD\" ]; then
        redis-server;
      else
        redis-server --requirepass \"$$REDIS_PASSWORD\";
      fi"

    ports:
      - "6379:6379"
    env_file:
      - .env.local

volumes:
  postgres_data: