server:
  port: 8081
  servlet:
    session:
      timeout: 24h

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC # Enforce UTC at the DB level

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

  jackson:
    serialization:
      fail-on-empty-beans: false

  security:
#    oauth2:
#      client:
#        registration:
#          google:
#            client-id: ${GOOGLE_CLIENT_ID:dummy-id}
#            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
#            scope: openid, profile, email
#          okta:
#            client-id: ${OKTA_CLIENT_ID:dummy-okta-id}
#            client-secret: ${OKTA_CLIENT_SECRET:dummy-secret}
#            scope: openid, profile, email
#        provider:
#          okta:
#            issuer-uri: ${OKTA_ISSUER_URI:https://dev-dummy.okta.com}


eureka:
  instance:
    hostname: localhost
    preferIpAddress: true
    ipAddress: 127.0.0.1
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 # 15 Minutes (Access Token)
  refresh-expiration: 604800000 # 7 Days (Refresh Token)
